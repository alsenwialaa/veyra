name: WordPress and WooCommerce integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-woocommerce:
    name: WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            woocommerce: '8.5.2'
            php: '8.1'
            database: mysql-8.0
            database_image: mysql:8.0
            database_health_command: mysqladmin ping --silent
          - wordpress: '7.1'
            woocommerce: '11.0.1'
            php: '8.4'
            database: mysql-8.0
            database_image: mysql:8.0
            database_health_command: mysqladmin ping --silent
          - wordpress: '7.1'
            woocommerce: '11.0.1'
            php: '8.4'
            database: mariadb-11.4
            database_image: mariadb:11.4
            database_health_command: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: veyra-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_DATABASE: wordpress
          MARIADB_ROOT_PASSWORD: veyra-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database_health_command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_CLI_ALLOW_ROOT: '1'
      VEYRA_WP_PATH: /tmp/veyra-wordpress
      VEYRA_CI_PASSWORD: veyra-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, json, mbstring, mysqli, openssl
          tools: composer:v2

      - name: Install WP-CLI
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output /tmp/wp
          chmod +x /tmp/wp
          /tmp/wp --info

      - name: Install WordPress and WooCommerce
        run: |
          mkdir -p "$VEYRA_WP_PATH"
          /tmp/wp core download --path="$VEYRA_WP_PATH" --version="${{ matrix.wordpress }}" --force
          /tmp/wp config create --path="$VEYRA_WP_PATH" --dbname=wordpress --dbuser=root --dbpass="$VEYRA_CI_PASSWORD" --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp config set WP_ENVIRONMENT_TYPE development --path="$VEYRA_WP_PATH"
          /tmp/wp config set WP_DEBUG true --path="$VEYRA_WP_PATH" --raw
          /tmp/wp config set WP_DEBUG_LOG true --path="$VEYRA_WP_PATH" --raw
          /tmp/wp config set WP_DEBUG_DISPLAY false --path="$VEYRA_WP_PATH" --raw
          /tmp/wp core install --path="$VEYRA_WP_PATH" --url=http://127.0.0.1:8080 --title='Veyra CI' --admin_user=admin --admin_password="$VEYRA_CI_PASSWORD-admin" --admin_email=ci@example.invalid --skip-email
          /tmp/wp plugin install "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.woocommerce }}.zip" --path="$VEYRA_WP_PATH" --activate
          python3 scripts/package_release.py --output /tmp/veyra-platform-candidate
          VEYRA_INSTALLABLE=$(find /tmp/veyra-platform-candidate -maxdepth 1 -type f -name '*-installable.zip' -print -quit)
          test -n "$VEYRA_INSTALLABLE"
          unzip -q "$VEYRA_INSTALLABLE" -d "$VEYRA_WP_PATH/wp-content/plugins"

      - name: Activate, re-activate, and run platform smoke contracts
        run: |
          /tmp/wp plugin activate veyra-ai-commerce-agent --path="$VEYRA_WP_PATH"
          /tmp/wp option update woocommerce_custom_orders_table_enabled no --path="$VEYRA_WP_PATH"
          CHECKOUT_PAGE_ID=$(/tmp/wp option get woocommerce_checkout_page_id --path="$VEYRA_WP_PATH")
          /tmp/wp post update "$CHECKOUT_PAGE_ID" --post_content='[woocommerce_checkout]' --path="$VEYRA_WP_PATH"
          /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/Integration/run-wordpress-woocommerce-smoke.php" legacy classic --path="$VEYRA_WP_PATH"
          /tmp/wp plugin deactivate veyra-ai-commerce-agent --path="$VEYRA_WP_PATH"
          /tmp/wp plugin activate veyra-ai-commerce-agent --path="$VEYRA_WP_PATH"
          /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/Integration/run-wordpress-woocommerce-smoke.php" legacy classic --path="$VEYRA_WP_PATH"

      - name: Exercise WooCommerce HPOS-authoritative CRUD
        run: |
          /tmp/wp option update woocommerce_custom_orders_table_enabled yes --path="$VEYRA_WP_PATH"
          CHECKOUT_PAGE_ID=$(/tmp/wp option get woocommerce_checkout_page_id --path="$VEYRA_WP_PATH")
          /tmp/wp post update "$CHECKOUT_PAGE_ID" --post_content='<!-- wp:woocommerce/checkout /-->' --path="$VEYRA_WP_PATH"
          /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/Integration/run-wordpress-woocommerce-smoke.php" hpos blocks --path="$VEYRA_WP_PATH"

      - name: Assert debug log has no fatal runtime error
        if: always()
        run: |
          test ! -f "$VEYRA_WP_PATH/wp-content/debug.log" || ! grep -E "PHP (Fatal error|Parse error)|Uncaught (Error|TypeError)" "$VEYRA_WP_PATH/wp-content/debug.log"

  browser-contract:
    name: Chromium widget and accessibility smoke
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: veyra-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CLI_ALLOW_ROOT: '1'
      VEYRA_WP_PATH: /tmp/veyra-browser-wordpress
      VEYRA_BASE_URL: http://127.0.0.1:8080
      VEYRA_CI_PASSWORD: veyra-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, json, mbstring, mysqli, openssl

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install WordPress, WooCommerce, and the isolated UI fixture
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output /tmp/wp
          chmod +x /tmp/wp
          mkdir -p "$VEYRA_WP_PATH"
          /tmp/wp core download --path="$VEYRA_WP_PATH" --version=7.1 --force
          /tmp/wp config create --path="$VEYRA_WP_PATH" --dbname=wordpress --dbuser=root --dbpass="$VEYRA_CI_PASSWORD" --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp config set WP_ENVIRONMENT_TYPE development --path="$VEYRA_WP_PATH"
          /tmp/wp config set VEYRA_E2E_FIXTURE true --path="$VEYRA_WP_PATH" --raw
          /tmp/wp core install --path="$VEYRA_WP_PATH" --url="$VEYRA_BASE_URL" --title='Veyra Browser CI' --admin_user=admin --admin_password="$VEYRA_CI_PASSWORD-admin" --admin_email=ci@example.invalid --skip-email
          /tmp/wp plugin install https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip --path="$VEYRA_WP_PATH" --activate
          python3 scripts/package_release.py --output /tmp/veyra-browser-candidate
          VEYRA_INSTALLABLE=$(find /tmp/veyra-browser-candidate -maxdepth 1 -type f -name '*-installable.zip' -print -quit)
          test -n "$VEYRA_INSTALLABLE"
          unzip -q "$VEYRA_INSTALLABLE" -d "$VEYRA_WP_PATH/wp-content/plugins"
          /tmp/wp plugin activate veyra-ai-commerce-agent --path="$VEYRA_WP_PATH"
          mkdir -p "$VEYRA_WP_PATH/wp-content/mu-plugins"
          cp "$GITHUB_WORKSPACE/tests/E2E/wordpress-fixture.php" "$VEYRA_WP_PATH/wp-content/mu-plugins/veyra-e2e-fixture.php"

      - name: Install pinned browser dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Start WordPress and run browser tests
        run: |
          php -d max_execution_time=120 \
            -S 127.0.0.1:8080 \
            -t "$VEYRA_WP_PATH" \
            "$GITHUB_WORKSPACE/tests/E2E/php-server-router.php" \
            > /tmp/veyra-wp-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$VEYRA_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$VEYRA_BASE_URL" --output /tmp/veyra-home.html
          ! grep --fixed-strings '/veyra-browser-wordpress/wp-content/' /tmp/veyra-home.html
          grep --fixed-strings '/wp-content/plugins/veyra-ai-commerce-agent/assets/customer/veyra-chat.js' /tmp/veyra-home.html
          curl --fail --silent --show-error \
            "$VEYRA_BASE_URL/wp-content/plugins/veyra-ai-commerce-agent/assets/customer/veyra-chat.js?ver=0.1.7" \
            --output /tmp/veyra-served-chat.js
          cmp \
            "$VEYRA_WP_PATH/wp-content/plugins/veyra-ai-commerce-agent/assets/customer/veyra-chat.js" \
            /tmp/veyra-served-chat.js
          npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-browser-diagnostics
          path: |
            /tmp/veyra-wp-server.log
            ${{ github.workspace }}/test-results/
          if-no-files-found: ignore
